<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="台灣美食英文配對互動測驗">
  <title>台灣美食英文配對</title>

  <style>
    :root {
      --bg: #EAE0D5;
      --ink: #2f2925;
      --muted: #756b64;
      --card: #fffaf4;
      --line: #d7c6b8;
      --accent: #b14f3e;
      --accent-dark: #7c3026;
      --correct: #8AFF86;
      --wrong: #FF0000;
      --shadow: 0 18px 50px rgba(84, 58, 39, .13);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
    }

    button {
      font: inherit;
    }

    button:focus-visible {
      outline: 4px solid #315f9c;
      outline-offset: 3px;
    }

    .site-header {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 26px 0 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-weight: 900;
      letter-spacing: .08em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      color: #fffaf4;
      background: var(--accent);
      box-shadow: 3px 3px 0 #8f382d;
      font-size: 1.15rem;
    }

    .header-note {
      color: var(--muted);
      font-size: .9rem;
    }

    .app {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 44px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
      animation: fade-in .3s ease both;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .hero {
      min-height: min(690px, calc(100vh - 150px));
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      align-items: center;
      gap: clamp(28px, 7vw, 92px);
      padding: clamp(28px, 6vw, 76px);
      border: 1px solid rgba(111, 78, 54, .12);
      border-radius: 34px;
      background: rgba(255, 250, 244, .7);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent-dark);
      font-size: .95rem;
      font-weight: 900;
      letter-spacing: .16em;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      max-width: 9em;
      margin-bottom: 22px;
      font-size: clamp(2.7rem, 6.2vw, 5.6rem);
      line-height: 1.12;
      letter-spacing: .03em;
    }

    .hero-copy {
      max-width: 550px;
      color: var(--muted);
      font-size: clamp(1rem, 1.7vw, 1.2rem);
    }

    .primary-btn,
    .secondary-btn {
      min-height: 52px;
      border: 0;
      border-radius: 999px;
      padding: 12px 26px;
      cursor: pointer;
      font-weight: 900;
      transition: transform .18s ease, box-shadow .18s ease,
        background .18s ease;
    }

    .primary-btn {
      color: #fffaf4;
      background: var(--accent);
      box-shadow: 0 7px 0 #80372d;
    }

    .primary-btn:hover,
    .secondary-btn:hover {
      transform: translateY(-2px);
    }

    .primary-btn:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 #80372d;
    }

    .secondary-btn {
      color: var(--accent-dark);
      border: 2px solid var(--accent);
      background: transparent;
    }

    .hero-art {
      position: relative;
      min-height: 360px;
      display: grid;
      place-items: center;
    }

    .hero-art::before,
    .hero-art::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      opacity: .5;
    }

    .hero-art::before {
      width: 280px;
      height: 280px;
      background: #f3c77d;
      transform: rotate(18deg);
    }

    .hero-art::after {
      width: 140px;
      height: 140px;
      background: #b9d6a3;
      right: 5%;
      bottom: 6%;
    }

    .bowl-art {
      position: relative;
      z-index: 1;
      width: min(100%, 410px);
      filter: drop-shadow(0 16px 10px rgba(75, 48, 30, .2));
    }

    .quiz-shell {
      max-width: 850px;
      margin: 0 auto;
    }

    .quiz-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .progress-label {
      margin: 0;
      color: var(--muted);
      font-size: .95rem;
      font-weight: 900;
    }

    .progress-track {
      flex: 1;
      height: 10px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(121, 84, 56, .16);
    }

    .progress-bar {
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width .3s ease;
    }

    .question-card {
      padding: clamp(20px, 4vw, 42px);
      border: 1px solid rgba(111, 78, 54, .13);
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .question-visual {
      display: grid;
      grid-template-columns: minmax(180px, 270px) 1fr;
      align-items: center;
      gap: clamp(22px, 5vw, 48px);
      margin-bottom: 30px;
    }

    .food-image {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      border-radius: 22px;
      background: #f5eee7;
    }

    .question-number {
      margin: 0 0 8px;
      color: var(--accent);
      font-weight: 900;
    }

    .question-heading {
      margin: 0 0 12px;
      font-size: clamp(1.55rem, 3vw, 2.4rem);
      line-height: 1.25;
    }

    .question-hint {
      margin: 0;
      color: var(--muted);
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .option-btn {
      min-height: 70px;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 14px 18px;
      color: var(--ink);
      text-align: left;
      border: 2px solid var(--line);
      border-radius: 17px;
      background: #fffdf9;
      cursor: pointer;
      font-size: 1.05rem;
      font-weight: 800;
      transition: transform .16s ease, border-color .16s ease,
        background .16s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-letter {
      display: grid;
      place-items: center;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: var(--accent-dark);
      background: #f2dfcc;
      font-weight: 900;
    }

    .option-btn.is-correct {
      border-color: #23911e;
      background: var(--correct);
      color: #10350e;
    }

    .option-btn.is-correct .option-letter {
      color: #10350e;
      background: rgba(255, 255, 255, .55);
    }

    .option-btn.is-wrong {
      border-color: #980000;
      background: var(--wrong);
      color: #fff;
    }

    .option-btn.is-wrong .option-letter {
      color: #650000;
      background: #fff;
    }

    .answer-message {
      min-height: 30px;
      margin: 20px 0 0;
      font-weight: 900;
    }

    .answer-message.correct {
      color: #176c13;
    }

    .answer-message.wrong {
      color: #8e0000;
    }

    .question-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .results-card {
      max-width: 700px;
      margin: 6vh auto 0;
      padding: clamp(28px, 7vw, 66px);
      text-align: center;
      border: 1px solid rgba(111, 78, 54, .13);
      border-radius: 32px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .result-icon {
      font-size: 3rem;
    }

    .results-card h2 {
      margin: 8px 0 10px;
      font-size: clamp(2rem, 5vw, 3.8rem);
    }

    .score-number {
      margin: 10px 0 18px;
      color: var(--accent);
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 1000;
      line-height: 1;
    }

    .result-text {
      color: var(--muted);
      font-size: 1.05rem;
    }

    .result-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    @media (max-width: 700px) {
      .site-header {
        padding-top: 18px;
      }

      .header-note {
        display: none;
      }

      .app {
        width: min(100% - 20px, 1100px);
        padding-top: 12px;
      }

      .hero {
        min-height: auto;
        grid-template-columns: 1fr;
        padding: 30px 22px 26px;
        border-radius: 24px;
      }

      .hero-art {
        min-height: 230px;
        order: -1;
      }

      .hero-art::before {
        width: 210px;
        height: 210px;
      }

      h1 {
        font-size: clamp(2.6rem, 13vw, 4.2rem);
      }

      .question-visual {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .food-image {
        width: min(100%, 270px);
        margin: auto;
      }

      .options {
        grid-template-columns: 1fr;
      }

      .quiz-top {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .progress-track {
        order: 3;
        flex-basis: 100%;
      }

      .question-card {
        padding: 20px 16px;
        border-radius: 22px;
      }

      .question-actions {
        justify-content: stretch;
      }

      .question-actions .primary-btn {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">食</span>
      <span>TAIWAN BITES</span>
    </div>

    <div class="header-note">
      看圖、聽音、學英文
    </div>
  </header>

  <main class="app">
    <section id="start-screen" class="screen active" aria-labelledby="main-title">
      <div class="hero">
        <div>
          <p class="eyebrow">TAIWANESE FOOD × ENGLISH</p>

          <h1 id="main-title">
            台灣美食英文配對
          </h1>

          <p class="hero-copy">
            準備好認識台灣味了嗎？每回合會從 20 道美食中隨機抽出 5 題。
            點選選項時，還能聽聽正確的英文發音！
          </p>

          <button
            id="start-button"
            class="primary-btn"
            type="button"
            aria-label="開始台灣美食英文配對測驗">
            開始測驗
          </button>
        </div>

        <div class="hero-art" aria-hidden="true">
          <svg
            class="bowl-art"
            viewBox="0 0 420 360"
            role="img"
            aria-label="台灣小吃插畫">
            <path
              d="M70 151 Q210 214 350 151 L327 263 Q210 328 93 263Z"
              fill="#c44e3c"
              stroke="#642f2b"
              stroke-width="9" />

            <path
              d="M72 150 Q210 207 348 150 Q347 111 210 106 Q73 111 72 150Z"
              fill="#efc48d"
              stroke="#642f2b"
              stroke-width="9" />

            <path
              d="M106 136 Q153 104 181 136 Q207 97 244 133 Q282 94 319 141"
              fill="none"
              stroke="#fff4df"
              stroke-width="20"
              stroke-linecap="round" />

            <circle cx="143" cy="149" r="13" fill="#7c3026" />
            <circle cx="210" cy="153" r="13" fill="#7c3026" />
            <circle cx="279" cy="148" r="13" fill="#7c3026" />

            <path
              d="M118 214 Q210 246 302 214"
              fill="none"
              stroke="#f7d09b"
              stroke-width="12"
              stroke-linecap="round" />

            <path
              d="M114 274 Q210 309 306 274"
              fill="none"
              stroke="#8f382d"
              stroke-width="7"
              opacity=".6" />

            <path
              d="M115 68 Q90 31 116 16 Q139 43 154 77"
              fill="#759b57"
              stroke="#46633c"
              stroke-width="6" />

            <path
              d="M307 76 Q329 34 355 45 Q347 74 322 94"
              fill="#759b57"
              stroke="#46633c"
              stroke-width="6" />
          </svg>
        </div>
      </div>
    </section>

    <section id="quiz-screen" class="screen" aria-labelledby="question-heading">
      <div class="quiz-shell">
        <div class="quiz-top">
          <p id="progress-label" class="progress-label" aria-live="polite">
            第 1 / 5 題
          </p>

          <div
            class="progress-track"
            role="progressbar"
            aria-label="作答進度"
            aria-valuemin="0"
            aria-valuemax="5"
            aria-valuenow="1">
            <div
              id="progress-bar"
              class="progress-bar"
              style="width: 20%">
            </div>
          </div>
        </div>

        <div class="question-card">
          <div class="question-visual">
            <img id="food-image" class="food-image" alt="">

            <div>
              <p id="question-number" class="question-number">
                QUESTION 01
              </p>

              <h2 id="question-heading">
                這道台灣美食的英文是？
              </h2>

              <p id="question-hint" class="question-hint">
                看圖選出最適合的英文名稱。點選後會自動朗讀。
              </p>
            </div>
          </div>

          <div
            id="options"
            class="options"
            role="group"
            aria-label="英文答案選項">
          </div>

          <p
            id="answer-message"
            class="answer-message"
            role="status"
            aria-live="polite">
          </p>

          <div class="question-actions">
            <button
              id="next-button"
              class="primary-btn"
              type="button"
              hidden>
              下一題
            </button>
          </div>
        </div>
      </div>
    </section>

    <section id="result-screen" class="screen" aria-labelledby="result-title">
      <div class="results-card">
        <div class="result-icon" aria-hidden="true">✦</div>

        <h2 id="result-title">
          完成作答！
        </h2>

        <div id="score-number" class="score-number">
          0 / 5
        </div>

        <p id="result-text" class="result-text">
          答對了 0 題，繼續加油！
        </p>

        <div class="result-actions">
          <button
            id="retry-button"
            class="primary-btn"
            type="button">
            錯題再練
          </button>

          <button
            id="restart-button"
            class="secondary-btn"
            type="button">
            重新開始
          </button>
        </div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const foods = [
        { id: "beef-noodle", zh: "牛肉麵", en: "Beef noodle soup", color: "#b74b3b", type: "noodle" },
        { id: "bubble-tea", zh: "珍珠奶茶", en: "Bubble tea", color: "#8b5a3c", type: "tea" },
        { id: "oyster-omelet", zh: "蚵仔煎", en: "Oyster omelet", color: "#e28d42", type: "omelet" },
        { id: "stinky-tofu", zh: "臭豆腐", en: "Stinky tofu", color: "#d6a84d", type: "tofu" },
        { id: "scallion-pancake", zh: "蔥油餅", en: "Scallion pancake", color: "#b9823b", type: "pancake" },
        { id: "chicken-rice", zh: "雞肉飯", en: "Chicken rice", color: "#e2b95e", type: "rice" },
        { id: "braised-pork-rice", zh: "滷肉飯", en: "Braised pork rice", color: "#9a543c", type: "lu-rou" },
        { id: "pepper-bun", zh: "胡椒餅", en: "Pepper bun", color: "#bd6d3a", type: "bun" },
        { id: "pork-blood-cake", zh: "豬血糕", en: "Pork blood cake", color: "#51333c", type: "cake" },
        { id: "turkey-rice", zh: "火雞肉飯", en: "Turkey rice", color: "#ba7545", type: "turkey" },
        { id: "three-cup-chicken", zh: "三杯雞", en: "Three-cup chicken", color: "#a65c33", type: "chicken" },
        { id: "taiwanese-sausage", zh: "台式香腸", en: "Taiwanese sausage", color: "#d6634c", type: "sausage" },
        { id: "tang-yuan", zh: "湯圓", en: "Glutinous rice balls", color: "#e8a8aa", type: "tangyuan" },
        { id: "pineapple-cake", zh: "鳳梨酥", en: "Pineapple cake", color: "#d6a048", type: "pineapple" },
        { id: "sun-cake", zh: "太陽餅", en: "Sun cake", color: "#d99551", type: "sun-cake" },
        { id: "dan-bing", zh: "蛋餅", en: "Egg crepe", color: "#efc45b", type: "danbing" },
        { id: "lu-wei", zh: "滷味", en: "Braised snacks", color: "#805536", type: "luwei" },
        { id: "fish-ball-soup", zh: "魚丸湯", en: "Fish ball soup", color: "#6e9cb0", type: "fishball" },
        { id: "aiyu-jelly", zh: "愛玉冰", en: "Aiyu jelly", color: "#dbb65b", type: "aiyu" },
        { id: "shaved-ice", zh: "芒果冰", en: "Mango shaved ice", color: "#f3a33d", type: "ice" }
      ];

      const screens = {
        start: document.getElementById("start-screen"),
        quiz: document.getElementById("quiz-screen"),
        result: document.getElementById("result-screen")
      };

      const startButton = document.getElementById("start-button");
      const nextButton = document.getElementById("next-button");
      const retryButton = document.getElementById("retry-button");
      const restartButton = document.getElementById("restart-button");

      const progressLabel = document.getElementById("progress-label");
      const progressBar = document.getElementById("progress-bar");
      const progressTrack = progressBar.parentElement;

      const foodImage = document.getElementById("food-image");
      const questionNumber = document.getElementById("question-number");
      const questionHeading = document.getElementById("question-heading");
      const questionHint = document.getElementById("question-hint");
      const options = document.getElementById("options");
      const answerMessage = document.getElementById("answer-message");

      const scoreNumber = document.getElementById("score-number");
      const resultText = document.getElementById("result-text");

      let roundQuestions = [];
      let currentIndex = 0;
      let score = 0;
      let currentRoundMissedIds = [];
      let answered = false;
      let lastRoundWasRetry = false;

      function svgData(svg) {
        return "data:image/svg+xml;charset=UTF-8," +
          encodeURIComponent(
            svg.replace(/\n\s+/g, " ").trim()
          );
      }

      function foodSvg(food) {
        const bg =
          "<rect width='500' height='500' rx='42' fill='#f8eee3'/>" +
          "<circle cx='250' cy='250' r='194' fill='" +
          food.color +
          "' opacity='.14'/>" +
          "<path d='M72 404 Q250 438 428 404' fill='none' stroke='#a5795c' stroke-width='8' opacity='.35'/>";

        const plate =
          "<ellipse cx='250' cy='356' rx='156' ry='35' fill='#b98c6d' opacity='.3'/>" +
          "<ellipse cx='250' cy='324' rx='164' ry='58' fill='#fff8e9' stroke='#7c5140' stroke-width='8'/>";

        const steam =
          "<path d='M190 135 C160 104 214 87 184 56 M250 132 C220 96 275 79 246 48 M311 135 C282 103 336 84 307 55' fill='none' stroke='#d38c6d' stroke-width='9' stroke-linecap='round' opacity='.8'/>";

        let art = "";

        switch (food.type) {
          case "noodle":
            art =
              steam +
              plate +
              "<path d='M115 292 Q250 384 385 292 L365 190 Q250 150 135 190Z' fill='#c64f3b' stroke='#70342f' stroke-width='9'/>" +
              "<path d='M132 206 Q250 265 368 206' fill='none' stroke='#efc987' stroke-width='35' stroke-linecap='round'/>" +
              "<path d='M150 226 Q244 284 350 226 M140 248 Q250 311 361 246 M158 270 Q250 325 341 271' fill='none' stroke='#f8e2a9' stroke-width='12' stroke-linecap='round'/>" +
              "<ellipse cx='185' cy='201' rx='35' ry='18' fill='#6e352c'/>" +
              "<ellipse cx='299' cy='210' rx='37' ry='18' fill='#6e352c'/>";
            break;

          case "tea":
            art =
              "<path d='M181 151 H319 L305 355 Q250 385 195 355Z' fill='#f4c98c' stroke='#704436' stroke-width='9'/>" +
              "<path d='M181 151 H319 V207 H181Z' fill='#73472e'/>" +
              "<path d='M173 151 H327' stroke='#704436' stroke-width='18' stroke-linecap='round'/>" +
              "<path d='M319 218 Q383 208 371 271 Q364 306 319 288' fill='none' stroke='#704436' stroke-width='13'/>" +
              "<g fill='#211a19'>" +
              "<circle cx='218' cy='326' r='14'/>" +
              "<circle cx='255' cy='337' r='14'/>" +
              "<circle cx='290' cy='326' r='14'/>" +
              "<circle cx='232' cy='294' r='14'/>" +

      function shuffle(items) {
        const copy = items.slice();

        for (let i = copy.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }

        return copy;
      }

      function showScreen(name) {
        Object.keys(screens).forEach((key) => {
          screens[key].classList.toggle("active", key === name);
        });

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }

      function getEnglishVoice() {
        if (!("speechSynthesis" in window)) {
          return null;
        }

        const voices = window.speechSynthesis.getVoices();
        const preferredPrefixes = ["en-us", "en-gb", "en"];

        for (const prefix of preferredPrefixes) {
          const voice = voices.find((candidate) => {
            const language = String(candidate.lang || "").toLowerCase();

            return language === prefix ||
              language.startsWith(prefix + "-");
          });

          if (voice) {
            return voice;
          }
        }

        return null;
      }

      function stopSpeech() {
        if (!("speechSynthesis" in window)) {
          return;
        }

        try {
          window.speechSynthesis.cancel();
        } catch (error) {
          // 瀏覽器不支援時忽略錯誤
        }
      }

      function speakOption(button, fallbackFood) {
        if (
          !("speechSynthesis" in window) ||
          !("SpeechSynthesisUtterance" in window)
        ) {
          return;
        }

        const visibleLabel = button &&
          button.querySelector(".option-label");

        const text = visibleLabel
          ? visibleLabel.textContent.trim()
          : (
              fallbackFood && fallbackFood.en
                ? fallbackFood.en
                : ""
            );

        if (!text) {
          return;
        }

        try {
          window.speechSynthesis.cancel();

          const utterance = new SpeechSynthesisUtterance(text);
          const voice = getEnglishVoice();

          if (voice) {
            utterance.voice = voice;
            utterance.lang = voice.lang || "en-US";
          } else {
            utterance.lang = "en-US";
          }

          utterance.rate = 0.86;
          utterance.pitch = 1;

          window.speechSynthesis.speak(utterance);
        } catch (error) {
          // 語音失敗時不影響作答
        }
      }

      if ("speechSynthesis" in window) {
        window.speechSynthesis.addEventListener(
          "voiceschanged",
          getEnglishVoice
        );
      }

      function makeOptions(correctFood) {
        const distractors = shuffle(
          foods.filter((food) => food.id !== correctFood.id)
        ).slice(0, 3);

        return shuffle([correctFood].concat(distractors));
      }

      function beginRound(questionList, isRetry) {
        const safeQuestionList = Array.isArray(questionList)
          ? questionList.filter(Boolean)
          : [];

        if (safeQuestionList.length === 0) {
          return;
        }

        roundQuestions = safeQuestionList.slice();
        currentIndex = 0;
        score = 0;
        currentRoundMissedIds = [];
        answered = false;
        lastRoundWasRetry = Boolean(isRetry);

        stopSpeech();
        showScreen("quiz");
        renderQuestion();
      }

      function renderQuestion() {
        const food = roundQuestions[currentIndex];

        answered = false;

        const total = roundQuestions.length;

        progressLabel.textContent =
          "第 " +
          (currentIndex + 1) +
          " / " +
          total +
          " 題" +
          (lastRoundWasRetry ? "・錯題再練" : "");

        progressBar.style.width =
          (((currentIndex + 1) / total) * 100) +
          "%";

        progressTrack.setAttribute(
          "aria-valuemax",
          String(total)
        );

        progressTrack.setAttribute(
          "aria-valuenow",
          String(currentIndex + 1)
        );

        foodImage.src = svgData(foodSvg(food));
        foodImage.alt = food.zh + "的自製插畫";

        questionNumber.textContent =
          "QUESTION " +
          String(currentIndex + 1).padStart(2, "0");

        questionHeading.textContent =
          "這道「" +
          food.zh +
          "」的英文是？";

        questionHint.textContent =
          "看圖選出最適合的英文名稱。點選後會自動朗讀。";

        answerMessage.textContent = "";
        answerMessage.className = "answer-message";

        nextButton.hidden = true;
        nextButton.textContent =
          currentIndex === total - 1
            ? "結束作答"
            : "下一題";

        options.replaceChildren();

        const optionFoods = makeOptions(food);

        optionFoods.forEach((optionFood, index) => {
          const button = document.createElement("button");

          button.type = "button";
          button.className = "option-btn";

          button.setAttribute(
            "aria-label",
            "選項 " +
            String.fromCharCode(65 + index) +
            "：" +
            optionFood.en
          );

          const letter = document.createElement("span");
          letter.className = "option-letter";
          letter.setAttribute("aria-hidden", "true");
          letter.textContent =
            String.fromCharCode(65 + index);

          const label = document.createElement("span");
          label.className = "option-label";
          label.textContent = optionFood.en;

          button.dataset.foodId = optionFood.id;

          button.append(letter, label);

          button.addEventListener("click", () => {
            selectAnswer(button, food);
          });

          options.append(button);
        });
      }

      function selectAnswer(selectedButton, correctFood) {
        if (
          answered ||
          !selectedButton ||
          selectedButton.disabled
        ) {
          return;
        }

        answered = true;

        const selectedId = selectedButton.dataset.foodId;
        const selectedFood = foods.find(
          (food) => food.id === selectedId
        );

        speakOption(selectedButton, selectedFood);

        const allButtons = Array.from(
          options.querySelectorAll("button")
        );

        allButtons.forEach((button) => {
          button.disabled = true;
        });

        const correctButton = allButtons.find(
          (button) =>
            button.dataset.foodId === correctFood.id
        );

        if (selectedId === correctFood.id) {
          selectedButton.classList.add("is-correct");

          answerMessage.textContent =
            "答對了！Great job!";

          answerMessage.classList.add("correct");

          score += 1;
        } else {
          selectedButton.classList.add("is-wrong");

          if (correctButton) {
            correctButton.classList.add("is-correct");
          }

          answerMessage.textContent =
            "再想一下！正確答案是「" +
            correctFood.en +
            "」。";

          answerMessage.classList.add("wrong");

          if (
            !currentRoundMissedIds.includes(correctFood.id)
          ) {
            currentRoundMissedIds.push(correctFood.id);
          }
        }

        nextButton.hidden = false;
        nextButton.focus();
      }

      function showResults() {
        const total = roundQuestions.length;
        const missedCount = currentRoundMissedIds.length;

        scoreNumber.textContent =
          score +
          " / " +
          total;

        stopSpeech();

        if (missedCount === 0) {
          resultText.textContent =
            lastRoundWasRetry
              ? "再練成績：答對 " +
                score +
                " 題；錯題數：0 題。太棒了，全部掌握了！"
              : "答對了 " +
                score +
                " 題；錯題數：0 題。你是台灣美食英文達人！";

          retryButton.hidden = true;
        } else {
          resultText.textContent =
            lastRoundWasRetry
              ? "再練成績：答對 " +
                score +
                " 題；錯題數：" +
                missedCount +
                " 題。"
              : "答對了 " +
                score +
                " 題；錯題數：" +
                missedCount +
                " 題。還可以繼續練習。";

          retryButton.hidden = false;

          retryButton.textContent =
            lastRoundWasRetry
              ? "再練剩餘錯題"
              : "錯題再練";
        }

        showScreen("result");

        (
          retryButton.hidden
            ? restartButton
            : retryButton
        ).focus();
      }

      startButton.addEventListener("click", () => {
        beginRound(
          shuffle(foods).slice(0, 5),
          false
        );
      });

      restartButton.addEventListener("click", () => {
        beginRound(
          shuffle(foods).slice(0, 5),
          false
        );
      });

      retryButton.addEventListener("click", () => {
        const retryIds = currentRoundMissedIds.slice();

        const retryFoods = retryIds
          .map((id) => foods.find((food) => food.id === id))
          .filter(Boolean);

        if (retryFoods.length > 0) {
          beginRound(retryFoods, true);
        }
      });

      nextButton.addEventListener("click", () => {
        if (!answered) {
          return;
        }

        if (currentIndex < roundQuestions.length - 1) {
          currentIndex += 1;
          renderQuestion();
          questionHeading.focus();
        } else {
          showResults();
        }
      });
    })();
